<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5865F2"/>
      <stop offset="100%" stop-color="#23272A"/>
    </linearGradient>
    <radialGradient id="goldCoin" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="60%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF6F00"/>
    </radialGradient>
  </defs>
  <!-- Gold Shield Coin -->
  <circle cx="60" cy="52" r="38" fill="url(#goldCoin)" stroke="#FFE082" stroke-width="4"/>
  <circle cx="60" cy="52" r="30" fill="none" stroke="#FF8F00" stroke-width="2" stroke-dasharray="4,3"/>
  <!-- HODL Text in Center -->
  <text x="60" y="58" font-family="Segoe UI, Impact, Arial" font-size="18" font-weight="900" fill="#212121" text-anchor="middle" letter-spacing="1">HODL</text>
  <!-- Diamond Hands on sides -->
  <polygon points="25,50 32,38 40,50 32,60" fill="#00E5FF" stroke="#00B0FF" stroke-width="1.5"/>
  <polygon points="95,50 88,38 80,50 88,60" fill="#00E5FF" stroke="#00B0FF" stroke-width="1.5"/>
  <!-- Banner -->
  <rect x="20" y="90" width="80" height="22" rx="6" fill="#23A55A"/>
  <text x="60" y="105" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">DIAMOND HANDS</text>
</svg>
