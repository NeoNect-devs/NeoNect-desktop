<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECEFF1"/>
      <stop offset="100%" stop-color="#90A4AE"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD600"/>
      <stop offset="50%" stop-color="#FF6D00"/>
      <stop offset="100%" stop-color="#DD2C00"/>
    </linearGradient>
  </defs>
  <g transform="rotate(45 60 60)">
    <!-- Flames -->
    <path d="M50 85 Q60 115 70 85 Q60 98 50 85 Z" fill="url(#flameGrad)"/>
    <path d="M54 85 Q60 105 66 85 Z" fill="#FFF9C4"/>
    <!-- Fins -->
    <polygon points="40,80 30,90 50,75" fill="#E53935"/>
    <polygon points="80,80 90,90 70,75" fill="#E53935"/>
    <!-- Rocket Main Hull -->
    <path d="M46 78 C46 45 60 15 60 15 C60 15 74 45 74 78 Z" fill="url(#rocketBody)"/>
    <!-- Nosecone -->
    <path d="M52 35 C55 25 60 15 60 15 C60 15 65 25 68 35 Z" fill="#E53935"/>
    <!-- Porthole Window -->
    <circle cx="60" cy="46" r="9" fill="#00E5FF" stroke="#37474F" stroke-width="2.5"/>
    <circle cx="58" cy="44" r="3" fill="#FFFFFF"/>
  </g>
  <!-- Stars & Moon in background -->
  <polygon points="20,15 22,20 27,21 23,24 24,29 20,26 16,29 17,24 13,21 18,20" fill="#FFD700"/>
  <polygon points="95,85 96,89 100,90 97,92 98,96 95,93 92,96 93,92 90,90 94,89" fill="#FFD700"/>
  <!-- "TO THE MOON" text -->
  <text x="60" y="112" font-family="Segoe UI, Arial" font-size="11" font-weight="900" fill="#5865F2" text-anchor="middle">TO THE MOON 🚀</text>
</svg>
