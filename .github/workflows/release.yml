name: Production Release CI/CD

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. WINDOWS RELEASE BUILD & PACKAGING
  # =========================================================================
  build-windows:
    name: Build & Package Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OpenSSL
        run: |
          choco install openssl.light --yes --no-progress
          if (Test-Path "C:\Program Files\OpenSSL") {
            echo "OPENSSL_ROOT_DIR=C:\Program Files\OpenSSL" >> $env:GITHUB_ENV
          } elseif (Test-Path "C:\Program Files\OpenSSL-Win64") {
            echo "OPENSSL_ROOT_DIR=C:\Program Files\OpenSSL-Win64" >> $env:GITHUB_ENV
          } elseif (Test-Path "C:\OpenSSL-Win64") {
            echo "OPENSSL_ROOT_DIR=C:\OpenSSL-Win64" >> $env:GITHUB_ENV
          }

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'

      - name: Setup Ninja & GCC (MinGW)
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Set Release Version Env
        run: |
          $Tag = "${{ github.ref_name }}"
          if ($Tag -notmatch '^v\d') { $Tag = "v${{ github.event.inputs.version }}" }
          echo "NEONECT_VERSION=$Tag" >> $env:GITHUB_ENV

      - name: Generate Release Notes & Patch Notes
        run: |
          python scripts/generate_release_notes.py

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DNEONECT_VERSION="${{ env.NEONECT_VERSION }}"

      - name: Build Application & Tests
        run: |
          cmake --build build --config Release --target NeoNectApp NeoNectTests

      - name: Run Desktop Test Suites
        run: |
          .\build\NeoNectTests.exe

      - name: Package Windows Artifacts
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/package_windows.ps1 -BuildDir build -Config Release -QtDir $env:QT_ROOT_DIR -OutputDir dist

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*.zip

  # =========================================================================
  # 2. LINUX RELEASE BUILD & PACKAGING
  # =========================================================================
  build-linux:
    name: Build & Package Linux x64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libgl1-mesa-dev libxkbcommon-dev libx11-xcb-dev libvulkan-dev libssl-dev

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'

      - name: Set Release Version Env
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then TAG="v${{ github.event.inputs.version }}"; fi
          echo "NEONECT_VERSION=$TAG" >> $GITHUB_ENV

      - name: Generate Release Notes & Patch Notes
        run: |
          python3 scripts/generate_release_notes.py

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DNEONECT_VERSION="${{ env.NEONECT_VERSION }}"

      - name: Build Application & Tests
        run: |
          cmake --build build --config Release --target NeoNectApp NeoNectTests

      - name: Run Desktop Test Suites
        run: |
          ./build/NeoNectTests

      - name: Package Linux Artifacts
        run: |
          chmod +x scripts/package_linux.sh
          ./scripts/package_linux.sh build Release dist

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/*.tar.gz

  # =========================================================================
  # 3. PUBLISH GITHUB RELEASE
  # =========================================================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release-assets/

      - name: Generate Release Notes
        run: |
          python3 scripts/generate_release_notes.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NeoNect ${{ github.ref_name }} Production Release
          body_path: RELEASE_NOTES.md
          draft: true
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
