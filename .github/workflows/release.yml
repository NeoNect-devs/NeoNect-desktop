name: Production Release CI/CD

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'release'
  cancel-in-progress: false

jobs:
  # =========================================================================
  # 1. WINDOWS RELEASE BUILD & PACKAGING
  # =========================================================================
  build-windows:
    name: Build & Package Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup OpenSSL (Full Developer SDK)
        run: |
          $Candidates = @("C:\Program Files\OpenSSL-Win64", "C:\Program Files\OpenSSL", "C:\OpenSSL-Win64", "C:\OpenSSL")
          $FoundDir = $null
          foreach ($dir in $Candidates) {
            if ((Test-Path "$dir\include\openssl\ssl.h") -and (Get-ChildItem -Path "$dir" -Filter "*crypto*.*" -Recurse | Where-Object { $_.Extension -in @(".lib", ".a") })) {
              $FoundDir = $dir
              break
            }
          }
          if (-not $FoundDir) {
            Write-Host "Installing full OpenSSL dev package via Chocolatey..."
            choco install openssl --yes --no-progress
            foreach ($dir in $Candidates) {
              if (Test-Path "$dir\include\openssl\ssl.h") { $FoundDir = $dir; break }
            }
          }
          Write-Host "Discovered OpenSSL root at: $FoundDir"
          if ($FoundDir -and ($FoundDir -ne "C:\OpenSSL")) {
            if (Test-Path "C:\OpenSSL") { Remove-Item -Force -Recurse "C:\OpenSSL" }
            New-Item -ItemType Junction -Path "C:\OpenSSL" -Target $FoundDir -Force
            $FoundDir = "C:\OpenSSL"
          }
          echo "OPENSSL_ROOT_DIR=$FoundDir" >> $env:GITHUB_ENV

      - name: Setup MSVC 2022 Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6 (MSVC 2022)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Set Release Version Env
        run: |
          $Tag = "${{ github.ref_name }}"
          if ($Tag -notmatch '^v\d') { $Tag = "v${{ github.event.inputs.version }}" }
          echo "NEONECT_VERSION=$Tag" >> $env:GITHUB_ENV

      - name: Generate Release Notes & Patch Notes
        run: |
          python scripts/generate_release_notes.py

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DNEONECT_VERSION="${{ env.NEONECT_VERSION }}"

      - name: Build Application & Tests
        run: |
          cmake --build build --config Release --target NeoNectApp NeoNectTests

      - name: Run Desktop Test Suites
        run: |
          # 1. Copy OpenSSL DLLs to build directory
          Get-ChildItem -Path "$env:OPENSSL_ROOT_DIR" -Filter "*crypto*.dll" -Recurse | ForEach-Object { Copy-Item $_.FullName -Destination "build" -Force }
          Get-ChildItem -Path "$env:OPENSSL_ROOT_DIR" -Filter "*ssl*.dll" -Recurse | ForEach-Object { Copy-Item $_.FullName -Destination "build" -Force }

          # 2. Copy Qt platform plugins to build directory
          if (Test-Path "${{ env.QT_ROOT_DIR }}\plugins\platforms") {
            New-Item -ItemType Directory -Path "build\platforms" -Force | Out-Null
            Copy-Item "${{ env.QT_ROOT_DIR }}\plugins\platforms\*" -Destination "build\platforms" -Force
          }

          # 3. Setup environment and force real-time console streaming
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = "${{ env.QT_ROOT_DIR }}\plugins\platforms"
          $env:QT_QPA_PLATFORM = "minimal"
          $env:QT_ASSUME_STDERR_HAS_CONSOLE = "1"
          $env:QT_FORCE_STDERR_LOGGING = "1"
          $env:PATH = "${{ env.QT_ROOT_DIR }}\bin;$env:OPENSSL_ROOT_DIR\bin;$env:OPENSSL_ROOT_DIR;$env:PATH"

          # 4. Execute test suite with output streamed to console host
          & .\build\NeoNectTests.exe 2>&1 | Out-Host
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Test suite failed with exit code $LASTEXITCODE"
          }

      - name: Package Windows Artifacts
        run: |
          $env:PATH = "${{ env.QT_ROOT_DIR }}\bin;$env:OPENSSL_ROOT_DIR\bin;$env:OPENSSL_ROOT_DIR;$env:PATH"
          powershell -ExecutionPolicy Bypass -File scripts/package_windows.ps1 -BuildDir build -Config Release -QtDir "${{ env.QT_ROOT_DIR }}" -OutputDir dist

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*.zip

  # =========================================================================
  # 2. LINUX RELEASE BUILD & PACKAGING
  # =========================================================================
  build-linux:
    name: Build & Package Linux x64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libgl1-mesa-dev libxkbcommon-dev libx11-xcb-dev libvulkan-dev libssl-dev

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'

      - name: Set Release Version Env
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then TAG="v${{ github.event.inputs.version }}"; fi
          echo "NEONECT_VERSION=$TAG" >> $GITHUB_ENV

      - name: Generate Release Notes & Patch Notes
        run: |
          python3 scripts/generate_release_notes.py

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DNEONECT_VERSION="${{ env.NEONECT_VERSION }}"

      - name: Build Application & Tests
        run: |
          cmake --build build --config Release --target NeoNectApp NeoNectTests

      - name: Run Desktop Test Suites
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export LD_LIBRARY_PATH="${{ env.QT_ROOT_DIR }}/lib:${LD_LIBRARY_PATH:-}"
          export PATH="${{ env.QT_ROOT_DIR }}/bin:${PATH}"
          ./build/NeoNectTests

      - name: Package Linux Artifacts
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export LD_LIBRARY_PATH="${{ env.QT_ROOT_DIR }}/lib:${LD_LIBRARY_PATH:-}"
          export PATH="${{ env.QT_ROOT_DIR }}/bin:${PATH}"
          chmod +x scripts/package_linux.sh
          ./scripts/package_linux.sh build Release dist

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/*.tar.gz

  # =========================================================================
  # 3. PUBLISH GITHUB RELEASE
  # =========================================================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release-assets/

      - name: Generate Release Notes
        run: |
          python3 scripts/generate_release_notes.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NeoNect ${{ github.ref_name }} Production Release
          body_path: RELEASE_NOTES.md
          draft: true
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # 4. DEPLOY DOCUMENTATION SITE (GITHUB PAGES)
  # =========================================================================
  deploy-docs:
    name: Build & Deploy Documentation Site
    needs: [build-windows, build-linux]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Release Version Env
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then TAG="v${{ github.event.inputs.version }}"; fi
          echo "NEONECT_VERSION=$TAG" >> $GITHUB_ENV

      - name: Generate Release Notes, Patch Notes & Sync Changelog
        run: |
          python3 scripts/generate_release_notes.py

      - name: Install Doxygen & Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Build Doxygen Documentation
        run: |
          doxygen Doxyfile

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Documentation Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/doxygen/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
